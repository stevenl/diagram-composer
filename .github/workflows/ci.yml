name: CI

# Build/test verification only. No release side effects — see release.yml
# for tagging, changelog generation, and artifact publishing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build test

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # commitlint needs the full commit range to inspect, not just the
          # single merge/HEAD commit a shallow checkout would give it.
          fetch-depth: 0

      - name: Lint commits against Conventional Commits (docs/development.md §5)
        uses: wagoid/commitlint-github-action@v6
